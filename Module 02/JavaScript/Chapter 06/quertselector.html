<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Selector</title>
</head>
<body>
    <div id="div-id">
        <h1 class="h1-class">AL QURAN ACADEMY</h1>
        <p class="p1-01">The academy is located in Federal B Area</p>
        <p class="p1">The academy is adminstered by Faizan Qadri Ziai</p>
        <p class="p1">The academy is offering multiple IT courses</p>
    </div>

    <script>
        let heading1 = document.querySelector(".h1-class")
        let paragraphs = document.querySelectorAll(".p1")
        let paragraph01 = document.querySelector(".p1-01")
        
        heading1.style.fontSize = "100px"
        heading1.style.color = "green"
        paragraph01.innerHTML = "Al Quran Academy is located in FB Area"


        paragraph01.style.color = "red";

        function myheading() {
            paragraphs.forEach( i => {
                i.style.color = "red";
            });
        }

        myheading()

    </script>

</body>
